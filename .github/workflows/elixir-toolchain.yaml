---
name: OTP/Elixir toolchain

on:
  workflow_call:
    inputs:
      elixir_bc:
        type: string
        required: true
        description: Elixir version of the backward compatibility toolchain, for example `1.15.7-otp-26`.
      erlang_bc:
        type: string
        required: true
        description: Erlang/OTP version of the backward compatibility toolchain, for example `26.2.1`.
      bc_enabled:
        type: boolean
        default: false
        description: Whether or not to also run Elixir jobs against the backward compatibility toolchain.
      checkout_ref:
        type: string
        default: ""
        description: Ref to read `.tool-versions` from. Defaults to the ref that triggered the workflow.
    outputs:
      ELIXIR_DEV:
        description: Elixir version from `.tool-versions`.
        value: ${{ jobs.toolchain.outputs.ELIXIR_DEV }}
      ERLANG_DEV:
        description: Erlang/OTP version from `.tool-versions`.
        value: ${{ jobs.toolchain.outputs.ERLANG_DEV }}
      ELIXIR_BC:
        description: Elixir version of the backward compatibility toolchain.
        value: ${{ jobs.toolchain.outputs.ELIXIR_BC }}
      ERLANG_BC:
        description: Erlang/OTP version of the backward compatibility toolchain.
        value: ${{ jobs.toolchain.outputs.ERLANG_BC }}
      ELIXIR_BC_EXCLUDE:
        description: >-
          Elixir version to use in the matrix `exclude` entry of the backward
          compatibility toolchain. It is `ELIXIR_BC` when `bc_enabled` is false,
          so the entry removes that toolchain. It is `none` otherwise, so the
          entry matches nothing.
        value: ${{ jobs.toolchain.outputs.ELIXIR_BC_EXCLUDE }}

jobs:
  toolchain:
    name: Compute OTP/Elixir toolchain
    runs-on: ubuntu-24.04
    outputs:
      ELIXIR_DEV: ${{ steps.compute.outputs.ELIXIR_DEV }}
      ERLANG_DEV: ${{ steps.compute.outputs.ERLANG_DEV }}
      ELIXIR_BC: ${{ steps.compute.outputs.ELIXIR_BC }}
      ERLANG_BC: ${{ steps.compute.outputs.ERLANG_BC }}
      ELIXIR_BC_EXCLUDE: ${{ steps.compute.outputs.ELIXIR_BC_EXCLUDE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}
      - name: Read .tool-versions
        uses: endorama/asdf-parse-tool-versions@115a5df5884438dfd08a3a21e9c9efdf06dd907e # v1.7.0
      - name: Compute toolchain
        id: compute
        env:
          ELIXIR_BC: ${{ inputs.elixir_bc }}
          ERLANG_BC: ${{ inputs.erlang_bc }}
          BC_ENABLED: ${{ inputs.bc_enabled }}
        run: |
          if [[ -z "$ELIXIR_VERSION" || -z "$ERLANG_VERSION" ]]; then
            echo "::error::.tool-versions must define both elixir and erlang"
            exit 1
          fi
          {
            echo "ELIXIR_DEV=$ELIXIR_VERSION"
            echo "ERLANG_DEV=$ERLANG_VERSION"
            echo "ELIXIR_BC=$ELIXIR_BC"
            echo "ERLANG_BC=$ERLANG_BC"
            if [[ "$BC_ENABLED" == "true" ]]; then
              echo "ELIXIR_BC_EXCLUDE=none"
            else
              echo "ELIXIR_BC_EXCLUDE=$ELIXIR_BC"
            fi
          } >> "$GITHUB_OUTPUT"
